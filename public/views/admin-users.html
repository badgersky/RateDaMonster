<?php include 'partials/head.html'; ?>
<body>
    <?php include 'partials/nav.html'; ?>
    <main class="container">
        <h1>Managing Users</h1>
        <form method="GET" action="/admin/users" class="search-container">
            <input
                type="text"
                name="search"
                placeholder="Search user..."
                value="<?= htmlspecialchars($search ?? '') ?>"
                class="search-input">
        </form>
        <div class="table-wrapper">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <?php foreach ($users as $user): ?>
                    <tr>
                        <td><?= $user['id']; ?></td>
                        <td><?= $user['username']; ?></td>
                        <td>
                            <form action="/admin/delete-user/<?= $user['id']; ?>" method="POST" onsubmit="return confirm('Czy na pewno chcesz usunąć tego użytkownika?');">
                                <button type="submit" class="btn-delete">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <?php endforeach; ?>
                </tbody>
            </table>
            <div class="pagination">
                <?php if ($currentPage > 1): ?>
                    <a href="/admin/users?page=<?= $currentPage - 1 ?>&search=<?= urlencode($_GET['search'] ?? '') ?>">Previous</a>
                <?php endif; ?>

                <?php for ($i = 1; $i <= $totalPages; $i++): ?>
                    <a
                        href="/admin/users?page=<?= $i ?>"
                        class="<?= $i === $currentPage ? 'active' : '' ?>"
                    >
                        <?= $i ?>
                    </a>
                <?php endfor; ?>

                <?php if ($currentPage < $totalPages): ?>
                    <a href="/admin/users?page=<?= $currentPage + 1 ?>&search=<?= urlencode($_GET['search'] ?? '') ?>">Next</a>
                <?php endif; ?>
            </div>
        </div>
    </main>
</body>
</html>
