# 1. BLOK PRZEKIEROWANIA (HTTP -> HTTPS)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    # Jeśli ktoś wejdzie przez HTTP, przekieruj go na HTTPS
    return 301 https://$host$request_uri;
}

# 2. BLOK GŁÓWNY (HTTPS)
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    server_tokens off;

    # Ścieżki do certyfikatów wewnątrz kontenera (zmapowane w docker-compose)
    ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    # Bezpieczne ustawienia protokołów SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Twoja konfiguracja aplikacji
    root /app/;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}